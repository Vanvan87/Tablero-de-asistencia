# ============================================================================
# Configuracion del tablero. Ajusta aqui, no en el codigo.
# ============================================================================

# Ruta al archivo de datos que se carga por defecto (relativa a la raiz del
# proyecto). Puede ser .xlsx o .csv. Si no existe, la app pide subir el archivo.
fuente: data/OT-22.xlsx
hoja: Hoja1           # nombre de la hoja si es Excel; null = la primera

# ---------------------------------------------------------------------------
# Mapeo de columnas: "campo_interno: Nombre en tu archivo"
# Deja null los que no tengas. La app tambien intenta detectarlos sola por
# nombres parecidos (ignora acentos, mayusculas y espacios).
# ---------------------------------------------------------------------------
columnas:
  periodo: Periodo                  # numerico institucional (202311) o PR-26 / OT-25
  fecha: Fechas
  codigo: CALIF FINAL               # en el registro real el codigo vive aqui
  profesor: Nombre
  escuela: Escuela
  departamento: Desc_depto
  vicerrectoria: Vicerrectoría
  crn: CRN
  materia: Materia
  tipo_curso: Tipo de curso
  edificio: Edificio
  salon: Salón
  dia_semana: Día
  semana: Semana
  hora_programada: H_INI            # entero HHMM: 700 = 7:00
  hora_fin: H_FIN
  check_entrada: Check entrada      # hoy viene vacia; si algun dia se llena, activa minutos perdidos
  check_salida: Check salida

# ---------------------------------------------------------------------------
# Catalogo de codigos de registro
# ---------------------------------------------------------------------------
codigos:
  0: Asistencia
  1: Retraso inicial
  2: Salida previa
  4: Falta
  5: Aviso
  6: Unidad externa
  8: Sin etiqueta
  9: Autorizacion director

# Codigos que se excluyen de todo el analisis (indicacion del area funcional)
excluir: [10]

# Codigos que cuentan como incumplimiento de puntualidad
codigos_puntualidad: [1, 2]

# Codigo que cuenta como falta (se resta de la Asistencia Global)
codigo_falta: 4

# ---------------------------------------------------------------------------
# Umbrales de negocio
# ---------------------------------------------------------------------------
meta_puntualidad: 0.95        # 95%
umbral_verde: 0.98            # >= 98% se pinta verde
min_sesiones_profesor: 30     # minimo para aparecer en el ranking docente
min_sesiones_departamento: 100

# Etiquetas del encabezado
institucion: UDEM
area: Escolar y Registro Academico
titulo: Puntualidad y Asistencia Docente
